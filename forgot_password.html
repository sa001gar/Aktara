    <!-- Main Content -->
    <main class="min-h-screen hero-gradient flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">
            <div class="form-container rounded-2xl p-8">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-aktara-black mb-2">Forgot Password</h2>
                    <p class="text-gray-600">Enter your email to receive an OTP</p>
                </div>
                <!-- Step 1: Email Entry -->
                <form id="forgotForm" class="space-y-6" onsubmit="handleForgot(event)">
                    <div id="emailStep">
                        <label for="forgot-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input id="forgot-email" name="email" type="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-aktara-red transition-colors"
                            placeholder="Enter your email">
                    </div>
                    <!-- Step 2: OTP Entry (hidden by default) -->
                    <div id="otpStep" class="hidden">
                        <label for="otp" class="block text-sm font-medium text-gray-700 mb-2">Enter OTP</label>
                        <input id="otp" name="otp" type="text" maxlength="6"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-aktara-red transition-colors"
                            placeholder="Enter the OTP sent to your email">
                        <button type="button" class="text-xs text-aktara-red mt-2 hover:underline" onclick="resendOTP()">Resend OTP</button>
                    </div>
                    <!-- Step 3: New Password (hidden by default) -->
                    <div id="passwordStep" class="hidden">
                        <label for="new-password" class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                        <div class="relative">
                            <input id="new-password" name="new-password" type="password"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-aktara-red transition-colors pr-12"
                                placeholder="Enter new password">
                            <button type="button"
                                class="password-toggle absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                onclick="togglePassword('new-password', this)">
                                <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                    </path>
                                </svg>
                                <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .525-1.666 1.558-3.169 2.857-4.333M15 12a3 3 0 11-6 0 3 3 0 016 0zm6.142-3.142a10.035 10.035 0 012.402 3.142C20.268 16.057 16.477 19 12 19c-.99 0-1.953-.138-2.864-.403M2 2l20 20"></path>
                                    </path>
                                </svg>
                            </button>
                        </div>

                    <button id="submitBtn" type="submit"
                        class="w-full py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-aktara-red hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-aktara-red transition-all duration-300 transform hover:scale-105">

    <!-- Back to Top Button -->
    <button id="backToTop"
        class="fixed bottom-6 right-6 bg-aktara-red text-white p-3 rounded-full shadow-lg opacity-0 invisible transition-all duration-300 hover:bg-red-700 transform hover:scale-110 z-50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
        </svg>
    </button>

    <!-- Scripts -->
    <script>
        // Mobile menu toggle
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.classList.toggle('hidden');
        }

        // Password toggle functionality
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeOpen = button.querySelector('.eye-open');
            const eyeClosed = button.querySelector('.eye-closed');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        }

        // Forgot password flow
        let currentStep = 1;
        function handleForgot(event) {
            event.preventDefault();
            if (currentStep === 1) {
                // Simulate sending OTP
                document.getElementById('emailStep').classList.add('hidden');
                document.getElementById('otpStep').classList.remove('hidden');
                document.getElementById('otp').setAttribute('required', 'required');
                document.getElementById('submitBtn').textContent = 'Verify OTP';
                currentStep = 2;
            } else if (currentStep === 2) {
                // Simulate OTP verification
                document.getElementById('otpStep').classList.add('hidden');
                document.getElementById('otp').removeAttribute('required');
                document.getElementById('passwordStep').classList.remove('hidden');
                document.getElementById('new-password').setAttribute('required', 'required');
                document.getElementById('submitBtn').textContent = 'Reset Password';
                currentStep = 3;
            } else if (currentStep === 3) {
                // Simulate password reset
                document.getElementById('new-password').removeAttribute('required');
                alert('Your password has been reset successfully!');
                window.location.href = 'login.html';
            }
        }
        function resendOTP() {
            alert('OTP resent to your email!');
        }

        // Wishlist toggle
        function toggleWishlist() {
            // Add wishlist functionality here
            console.log('Wishlist toggled');
        }

        // Scroll progress bar
        window.addEventListener('scroll', function () {
            const scrollProgress = document.getElementById('scrollProgress');
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrollPercent = (scrollTop / scrollHeight) * 100;
            scrollProgress.style.width = scrollPercent + '%';
        });

        // Back to top button
        const backToTopButton = document.getElementById('backToTop');
        window.addEventListener('scroll', function () {
            if (window.pageYOffset > 300) {
                backToTopButton.classList.remove('opacity-0', 'invisible');
                backToTopButton.classList.add('opacity-100', 'visible');
            } else {
                backToTopButton.classList.add('opacity-0', 'invisible');
                backToTopButton.classList.remove('opacity-100', 'visible');
            }
        });
        backToTopButton.addEventListener('click', function () {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
